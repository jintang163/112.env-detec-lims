server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml font/woff2;
    gzip_min_length 1k;

    # SPA history 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 REST API
    location /api/ {
        proxy_pass http://lims-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    # WebSocket 实时通知
    location /api/ws/ {
        proxy_pass http://lims-backend:8080/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
    }

    # OnlyOffice 文档服务(如部署在同一主机)
    location /onlyoffice/ {
        proxy_pass http://onlyoffice-ds/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        client_max_body_size 100m;
    }
}
